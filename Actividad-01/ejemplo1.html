
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cambiar contenido HTML</title>
</head>
<body>
<h1>Cambiar el contenido HTML</h1>
<p id="mensaje">Este es el contenido original.</p>
<button type="button" onclick="cambiarContenido()">Cambiar
contenido</button>
<script>
function cambiarContenido() {
document.getElementById("mensaje").textContent =
"Este contenido ha sido cambiado desde JavaScript.";
}

</body>
</html>
